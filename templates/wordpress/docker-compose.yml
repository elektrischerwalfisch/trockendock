services:
  db:
    image: ${MARIADB_IMAGE}
    container_name: ${PROJECT_SLUG}-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: ${WORDPRESS_IMAGE}
    container_name: ${PROJECT_SLUG}-wp
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      # Multisite toggles (read by WORDPRESS_CONFIG_EXTRA). DOMAIN_CURRENT_SITE is
      # derived as localhost:<WP_PORT> so it stays in sync with the published port.
      WP_PORT: ${WP_PORT}
      WP_MULTISITE: ${WP_MULTISITE:-0}
      WP_MULTISITE_SUBDOMAIN: ${WP_MULTISITE_SUBDOMAIN:-0}
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
        if (getenv('WP_MULTISITE') === '1') {
          define('WP_ALLOW_MULTISITE', true);
          define('MULTISITE', true);
          define('SUBDOMAIN_INSTALL', getenv('WP_MULTISITE_SUBDOMAIN') === '1');
          define('DOMAIN_CURRENT_SITE', 'localhost:' . (getenv('WP_PORT') ?: '80'));
          define('PATH_CURRENT_SITE', '/');
          define('SITE_ID_CURRENT_SITE', 1);
          define('BLOG_ID_CURRENT_SITE', 1);
        }
    volumes:
      - ./wp-content:/var/www/html/wp-content
      # Persist rewrite rules across container recreate (Multisite path installs need this).
      - ./.htaccess:/var/www/html/.htaccess

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${PROJECT_SLUG}-pma
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ${PROJECT_SLUG}-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_UI_PORT}:8025"
      - "${MAILHOG_SMTP_PORT}:1025"

volumes:
  db_data:
    name: ${PROJECT_SLUG}_db_data
